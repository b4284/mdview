<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mdview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="themecss" rel="stylesheet" href="/__assets/github-markdown-css/github-markdown.css">
<style>
  body { margin: 0; background: #fff; }
  .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 32px 24px; }
  @media (prefers-color-scheme: dark) { body[data-theme="auto"] { background: #0d1117; } }

  #themesel, #tocbtn { position: fixed; top: 10px; z-index: 10; opacity: .6;
              font: 13px system-ui, sans-serif; padding: 3px 6px; border-radius: 6px; }
  #themesel { right: 12px; }
  #tocbtn { left: 12px; display: none; cursor: pointer; }
  body.has-toc #tocbtn { display: block; }
  #themesel:hover, #themesel:focus, #tocbtn:hover { opacity: 1; }
  @media print { #themesel, #tocbtn, #toc { display: none !important; } #page { margin-left: 0 !important; } }

  /* DocFX table of contents sidebar */
  #toc { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; max-width: none; margin: 0;
         padding: 48px 12px 24px; overflow: auto; border-right: 1px solid rgba(128,128,128,.3);
         font-size: 14px; display: none; z-index: 5; }
  body.has-toc:not(.toc-hidden) #toc { display: block; }
  body.has-toc:not(.toc-hidden) #page { margin-left: 280px; }
  @media (max-width: 900px) { body.has-toc:not(.toc-hidden) #page { margin-left: 0; } }
  #toc ul { list-style: none; margin: 0; padding-left: 14px; }
  #toc > ul { padding-left: 0; }
  #toc li { margin: 3px 0; }
  #toc a { text-decoration: none; }
  #toc a:hover { text-decoration: underline; }
  #toc a.current { font-weight: 700; }
  #toc summary { cursor: pointer; }

  /* DocFX alerts, tabs, unresolved xrefs */
  .markdown-body blockquote.alert { border-left-width: .25em !important; border-left-style: solid;
        border-left-color: var(--ac) !important; color: inherit !important; padding: .5em 1em;
        background: color-mix(in srgb, var(--ac) 12%, transparent); border-radius: 0 6px 6px 0; }
  .alert-note { --ac: #0969da; } .alert-tip { --ac: #1a7f37; } .alert-important { --ac: #8250df; }
  .alert-warning { --ac: #bf8700; } .alert-caution { --ac: #d1242f; }
  .alert-title { font-weight: 600; color: var(--ac); margin-bottom: .25em; }
  .tabbar { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid rgba(128,128,128,.4); margin: 16px 0 8px; }
  .tabbar button { font: inherit; background: none; color: inherit; border: 0; border-bottom: 2px solid transparent;
        padding: 6px 12px; cursor: pointer; opacity: .65; }
  .tabbar button.active { opacity: 1; font-weight: 600; border-bottom-color: #4a7bd0; }
  .tabpanel { display: none; } .tabpanel.active { display: block; }
  .xref { border-bottom: 1px dotted currentColor; cursor: help; }

  /* custom themes: layered over the GitHub light or dark base stylesheet */
  body.custom { background: var(--bg); }
  body.custom .markdown-body { color: var(--fg); background: var(--bg); font-family: var(--font, inherit); }
  body.custom .markdown-body a { color: var(--link); }
  body.custom .markdown-body h1, body.custom .markdown-body h2 { border-bottom-color: var(--border); }
  body.custom .markdown-body h6 { color: var(--muted); }
  body.custom .markdown-body hr { background: var(--border); }
  body.custom .markdown-body blockquote { color: var(--muted); border-left-color: var(--border); }
  body.custom .markdown-body code, body.custom .markdown-body tt { background: var(--code-bg); }
  body.custom .markdown-body pre, body.custom .markdown-body .highlight pre { background: var(--code-bg); }
  body.custom .markdown-body pre code { background: transparent; }
  body.custom .markdown-body table th, body.custom .markdown-body table td { border-color: var(--border); }
  body.custom .markdown-body table tr { background: var(--bg); border-top-color: var(--border); }
  body.custom .markdown-body table tr:nth-child(2n) { background: var(--code-bg); }
  body.custom #themesel, body.custom #tocbtn { color: var(--fg); background: var(--code-bg); border: 1px solid var(--border); }

  body[data-theme="sepia"] { --bg:#f4ecd8; --fg:#433422; --muted:#7a6a53; --link:#8b4513; --code-bg:#eadfc6; --border:#d3c4a3;
                             --font: Georgia, "Iowan Old Style", "Times New Roman", serif; }
  body[data-theme="solarized-light"] { --bg:#fdf6e3; --fg:#586e75; --muted:#93a1a1; --link:#268bd2; --code-bg:#eee8d5; --border:#e0d9c0; }
  body[data-theme="solarized-dark"]  { --bg:#002b36; --fg:#93a1a1; --muted:#657b83; --link:#268bd2; --code-bg:#073642; --border:#0f4a5a; }
  body[data-theme="nord"]            { --bg:#2e3440; --fg:#d8dee9; --muted:#9aa5b8; --link:#88c0d0; --code-bg:#3b4252; --border:#4c566a; }
</style>
</head>
<body data-theme="auto">
<select id="themesel" title="Theme" aria-label="Theme"></select>
<button id="tocbtn" type="button" title="Toggle table of contents" aria-label="Toggle table of contents">☰</button>
<nav id="toc" class="markdown-body" aria-label="Table of contents"></nav>
<div id="page"><article id="out" class="markdown-body">Loading…</article></div>
<script src="/__assets/marked/marked.min.js"></script>
<script src="/__assets/mermaid/dist/mermaid.min.js"></script>
<script src="/__assets/js-yaml/dist/js-yaml.min.js"></script>
<script>
  /* ---------- themes ---------- */
  const CSS = "/__assets/github-markdown-css/";
  // base: which GitHub stylesheet to load. custom: layered theme defined above. bg: page background for file themes.
  const THEMES = [
    { id: "auto",            label: "GitHub (follow system)", base: "github-markdown.css" },
    { id: "light",           label: "GitHub Light",           base: "github-markdown-light.css", dark: false, bg: "#ffffff" },
    { id: "dark",            label: "GitHub Dark",            base: "github-markdown-dark.css",  dark: true,  bg: "#0d1117" },
    { id: "dimmed",          label: "GitHub Dark Dimmed",     base: "github-markdown-dark-dimmed.css", dark: true, bg: "#22272e" },
    { id: "hc",              label: "GitHub Dark High Contrast", base: "github-markdown-dark-high-contrast.css", dark: true, bg: "#0a0c10" },
    { id: "light-cb",        label: "GitHub Light Colorblind", base: "github-markdown-light-colorblind.css", dark: false, bg: "#ffffff" },
    { id: "dark-cb",         label: "GitHub Dark Colorblind",  base: "github-markdown-dark-colorblind.css", dark: true, bg: "#0d1117" },
    { id: "sepia",           label: "Sepia (serif)",          base: "github-markdown-light.css", dark: false, custom: true },
    { id: "solarized-light", label: "Solarized Light",        base: "github-markdown-light.css", dark: false, custom: true },
    { id: "solarized-dark",  label: "Solarized Dark",         base: "github-markdown-dark.css",  dark: true,  custom: true },
    { id: "nord",            label: "Nord",                   base: "github-markdown-dark.css",  dark: true,  custom: true },
  ];

  const out = document.getElementById("out");
  const sel = document.getElementById("themesel");
  const tocEl = document.getElementById("toc");
  const params = new URLSearchParams(location.search);
  const file = params.get("f");
  let curTheme = THEMES[0];

  function isDark() {
    return curTheme.dark ?? matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function applyTheme(id) {
    curTheme = THEMES.find(t => t.id === id) || THEMES[0];
    document.getElementById("themecss").href = CSS + curTheme.base;
    document.body.dataset.theme = curTheme.id;
    document.body.classList.toggle("custom", !!curTheme.custom);
    document.body.style.background = curTheme.bg || "";
    sel.value = curTheme.id;
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default" });
  }

  for (const t of THEMES) sel.add(new Option(t.label, t.id));
  let saved = null;
  try { saved = localStorage.getItem("mdview-theme"); } catch (e) {}
  applyTheme(saved);
  sel.addEventListener("change", () => {
    try { localStorage.setItem("mdview-theme", sel.value); } catch (e) {}
    applyTheme(sel.value);
    last = null; load();            // re-render so Mermaid picks up the new theme
  });

  /* ---------- path helpers ---------- */
  let info = { docfxRoot: "", toc: null };     // from /__info: docfx.json folder, nearest toc.yml
  const dirOf = f => f.split("/").slice(0, -1).join("/");
  const encPath = p => p.split("/").map(encodeURIComponent).join("/");
  const splitRef = p => { const i = p.search(/[?#]/); return i < 0 ? [p, ""] : [p.slice(0, i), p.slice(i)]; };
  function joinPath(base, rel) {
    const u = new URL(rel, "http://h/" + (base ? base.replace(/\/?$/, "/") : ""));
    try { return decodeURIComponent(u.pathname.slice(1)); } catch (e) { return u.pathname.slice(1); }
  }
  // Server-root-relative path for a link target, or null if it points outside (http:, mailto:, xref:, ...).
  function resolve(p, baseDir) {
    if (p.startsWith("@@/")) return p.slice(3);                    // internal: already server-relative
    if (/^[a-z][a-z0-9+.-]*:/i.test(p) || p.startsWith("//")) return null;
    if (p.startsWith("~/")) return joinPath(info.docfxRoot, p.slice(2));   // DocFX project root
    if (p.startsWith("/")) return joinPath(info.docfxRoot, p.slice(1));
    return joinPath(baseDir, p);
  }
  async function fetchText(path) {
    try {
      const r = await fetch("/" + encPath(path) + "?raw=1&t=" + Date.now());
      return r.ok ? await r.text() : null;
    } catch (e) { return null; }
  }

  /* ---------- DocFX preprocessing: front matter, [!INCLUDE], [!code-*] ---------- */
  function splitFront(md) {
    const m = md.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/);
    if (!m) return { body: md, meta: {} };
    try {
      const meta = jsyaml.load(m[1]);
      if (meta && typeof meta === "object" && !Array.isArray(meta)) return { body: md.slice(m[0].length), meta };
    } catch (e) {}
    return { body: md, meta: {} };                // not YAML: leave it alone
  }
  const INC  = /\[!include\s*\[[^\]]*\]\(\s*([^)\s]+)[^)]*\)\s*\]/gi;
  const CODE = /\[!code-([\w#+-]+)\s*\[[^\]]*\]\(\s*([^)\s]+)[^)]*\)\s*\]/gi;
  async function replaceAsync(str, re, fn) {
    const jobs = [];
    str.replace(re, (...a) => { jobs.push(fn(...a)); return ""; });
    const res = await Promise.all(jobs);
    let i = 0;
    return str.replace(re, () => res[i++]);
  }
  // Apply fn to the parts of the text that are outside fenced code blocks.
  async function outsideFences(md, fn) {
    const segs = []; let cur = [], fence = null;
    for (const line of md.split("\n")) {
      const m = line.match(/^\s{0,3}(`{3,}|~{3,})/);
      if (!fence && m) { if (cur.length) segs.push({ t: cur.join("\n"), f: false }); cur = [line]; fence = m[1]; }
      else if (fence && m && m[1][0] === fence[0] && m[1].length >= fence.length && /^\s{0,3}[`~]+\s*$/.test(line)) {
        cur.push(line); segs.push({ t: cur.join("\n"), f: true }); cur = []; fence = null;
      } else cur.push(line);
    }
    if (cur.length) segs.push({ t: cur.join("\n"), f: !!fence });
    return (await Promise.all(segs.map(s => s.f ? s.t : fn(s.t)))).join("\n");
  }
  // Make relative links in an included file valid from the including file's folder.
  function rebase(text, fromDir) {
    const fix = (p) => {
      if (/^([a-z][a-z0-9+.-]*:|#|~\/|\/|@@\/)/i.test(p)) return null;
      const [pp, suf] = splitRef(p);
      return "@@/" + joinPath(fromDir, pp) + suf;
    };
    return text
      .replace(/(!?\[[^\]]*\]\()\s*([^)\s]+)/g, (m, pre, p) => { const r = fix(p); return r ? pre + r : m; })
      .replace(/(\b(?:src|href)=")([^"]+)"/g, (m, pre, p) => { const r = fix(p); return r ? pre + r + '"' : m; });
  }
  async function expand(md, dir, depth) {
    if (depth > 5) return md;
    return outsideFences(md, async seg => {
      seg = await replaceAsync(seg, INC, async (m, p) => {
        const rp = resolve(splitRef(p)[0], dir);
        if (rp == null) return m;
        const t = await fetchText(rp);
        if (t == null) return `\n> **mdview:** include not found: \`${p}\`\n`;
        let inc = splitFront(t).body;
        const idir = dirOf(rp);
        if (idir !== dir) inc = rebase(inc, idir);
        return "\n" + await expand(inc, idir, depth + 1) + "\n";
      });
      seg = await replaceAsync(seg, CODE, async (m, lang, p) => {
        const [pp, suf] = splitRef(p);
        const rp = resolve(pp, dir);
        if (rp == null) return m;
        const t = await fetchText(rp);
        if (t == null) return `\n> **mdview:** code file not found: \`${pp}\`\n`;
        let lines = t.replace(/\r\n/g, "\n").split("\n");
        const rg = suf.match(/^#L(\d+)(?:-L?(\d+))?/i);          // #L10-L20 or #L10
        if (rg) { const a = +rg[1], b = rg[2] ? +rg[2] : a; lines = lines.slice(a - 1, b); }
        const body = lines.join("\n").replace(/\n+$/, "");
        const run = Math.max(0, ...(body.match(/`+/g) || []).map(s => s.length));
        const ticks = "`".repeat(Math.max(3, run + 1));
        return `\n${ticks}${lang}\n${body}\n${ticks}\n`;
      });
      return seg;
    });
  }

  /* ---------- markdown rendering ---------- */
  const renderer = new marked.Renderer();
  const baseCode = renderer.code.bind(renderer);
  renderer.code = (code, lang, escaped) => {
    // marked 12 passes (code, infostring, escaped)
    const text = typeof code === "object" ? code.text : code;
    const l = typeof code === "object" ? code.lang : lang;
    if (l === "mermaid") return `<pre class="mermaid">${text.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>`;
    return baseCode(code, lang, escaped);
  };

  const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  const ALERTS = { note: "Note", tip: "Tip", warning: "Warning", important: "Important", caution: "Caution" };

  function decorate(dir) {
    // heading ids so #anchors work (GitHub-style slugs)
    const seen = {};
    out.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h => {
      if (h.id || h.querySelector('a[href^="#tab/"]')) return;   // tab headings are removed later; they must not take a slug
      let s = slug(h.textContent) || "section";
      const n = seen[s] = (seen[s] ?? -1) + 1;
      h.id = n ? `${s}-${n}` : s;
    });
    // links: .md links open in the viewer, ~/ and relative paths resolve, xref shown as unresolved
    out.querySelectorAll("a[href]").forEach(a => {
      const h = a.getAttribute("href");
      if (/^xref:/i.test(h)) {
        const sp = document.createElement("span");
        sp.className = "xref";
        sp.title = "DocFX cross-reference (not resolved by mdview): " + h.replace(/^xref:/i, "");
        sp.textContent = a.textContent.replace(/^xref:/i, "");
        a.replaceWith(sp);
        return;
      }
      if (h.startsWith("#")) return;
      const [pp, suf] = splitRef(h);
      const r = pp ? resolve(pp, dir) : null;
      if (r == null) { if (/^https?:/i.test(h)) { a.target = "_blank"; a.rel = "noopener"; } return; }
      if (/\.(md|markdown)$/i.test(pp)) {
        const frag = suf.includes("#") ? suf.slice(suf.indexOf("#")) : "";
        a.href = "/?f=" + encodeURIComponent(r) + frag;
      } else a.href = "/" + encPath(r) + suf;
    });
    out.querySelectorAll("img[src]").forEach(i => {
      const r = resolve(i.getAttribute("src"), dir);
      if (r != null) i.src = "/" + encPath(r);
    });
    // DocFX alerts: > [!NOTE] / TIP / WARNING / IMPORTANT / CAUTION
    out.querySelectorAll("blockquote").forEach(bq => {
      const p = bq.firstElementChild;
      if (!p || p.tagName !== "P") return;
      const m = p.innerHTML.match(/^\s*\[!(note|tip|warning|important|caution)\]\s*(?:<br\s*\/?>)?\s*/i);
      if (!m) return;
      const kind = m[1].toLowerCase();
      p.innerHTML = p.innerHTML.slice(m[0].length);
      if (!p.innerHTML.trim()) p.remove();
      bq.classList.add("alert", "alert-" + kind);
      const t = document.createElement("div");
      t.className = "alert-title"; t.textContent = ALERTS[kind];
      bq.prepend(t);
    });
  }

  // DocFX tabs:  #### [Title](#tab/id)  ...content...  up to the next heading or ---
  let tabPrefs = [];                                 // most recent selections, kept across re-renders
  function buildTabs() {
    const kids = [...out.children];
    const tabInfo = el => {
      const m = /^H([1-6])$/.exec(el.tagName);
      const a = m && el.querySelector('a[href^="#tab/"]');
      if (!a) return null;
      let id = a.getAttribute("href").slice(5);
      try { id = decodeURIComponent(id); } catch (e) {}
      return { level: +m[1], id: id.split("&")[0], title: a.textContent };
    };
    const groups = [];
    let i = 0;
    while (i < kids.length) {
      const ti = tabInfo(kids[i]);
      if (!ti) { i++; continue; }
      const group = document.createElement("div");
      group.className = "tabgroup";
      const bar = document.createElement("div");
      bar.className = "tabbar";
      group.append(bar);
      kids[i].before(group);
      const tabs = [];
      while (i < kids.length) {
        const t = tabInfo(kids[i]);
        if (!t || t.level !== ti.level) break;
        const head = kids[i++];
        const panel = document.createElement("div");
        panel.className = "tabpanel";
        while (i < kids.length && !/^H[1-6]$/.test(kids[i].tagName) && kids[i].tagName !== "HR") panel.append(kids[i++]);
        const btn = document.createElement("button");
        btn.type = "button"; btn.textContent = t.title;
        bar.append(btn); group.append(panel);
        tabs.push({ id: t.id, btn, panel });
        head.remove();
      }
      if (i < kids.length && kids[i].tagName === "HR") kids[i++].remove();   // --- closes the group
      groups.push(tabs);
    }
    const show = (tabs, k) => tabs.forEach((t, j) => { t.btn.classList.toggle("active", j === k); t.panel.classList.toggle("active", j === k); });
    for (const tabs of groups) {
      let k = 0;
      for (const id of tabPrefs) { const j = tabs.findIndex(t => t.id === id); if (j >= 0) { k = j; break; } }
      show(tabs, k);
      tabs.forEach(t => t.btn.addEventListener("click", () => {
        tabPrefs = [t.id, ...tabPrefs.filter(x => x !== t.id)];
        for (const g of groups) { const j = g.findIndex(x => x.id === t.id); if (j >= 0) show(g, j); }   // sync linked groups
      }));
    }
  }

  let last = null, busy = false, firstRender = true;
  async function load() {
    if (busy) return;
    busy = true;
    try {
      const raw = await fetchText(file);
      if (raw == null) { out.textContent = "Cannot load " + file; return; }
      const { body, meta } = splitFront(raw);
      const dir = dirOf(file);
      const md = await expand(body, dir, 0);
      if (md === last) return;                       // unchanged: skip redraw
      last = md;
      const y = scrollY;
      out.innerHTML = marked.parse(md, { renderer, gfm: true });
      decorate(dir);
      try { await mermaid.run({ querySelector: ".mermaid" }); } catch (e) { console.warn("mermaid:", e); }
      buildTabs();
      const h1 = out.querySelector("h1");
      document.title = (meta.title && String(meta.title)) || (h1 && h1.textContent) || file.split("/").pop();
      if (firstRender && location.hash.length > 1) {
        let id = location.hash.slice(1);
        try { id = decodeURIComponent(id); } catch (e) {}
        const el = document.getElementById(id);
        if (el) el.scrollIntoView();
      } else scrollTo(0, y);
      firstRender = false;
    } finally { busy = false; }
  }

  /* ---------- DocFX table of contents (toc.yml) ---------- */
  function tocLink(it, baseDir) {
    const h = it.topicHref || (it.href && !/(\/|toc\.ya?ml)$/i.test(splitRef(it.href)[0]) ? it.href : null);
    if (!h || /^xref:/i.test(h)) return null;
    if (/^https?:/i.test(h)) return { url: h, ext: true };
    const [pp, suf] = splitRef(h);
    const r = resolve(pp, baseDir);
    if (r == null) return null;
    if (/\.(md|markdown)$/i.test(pp)) return { url: "/?f=" + encodeURIComponent(r) + (suf.includes("#") ? suf.slice(suf.indexOf("#")) : ""), path: r };
    return { url: "/" + encPath(r) + suf, path: r };
  }
  function tocSub(it, baseDir) {                      // nested toc.yml to load on demand
    const h = it.href;
    if (!h || /^([a-z][a-z0-9+.-]*:)/i.test(h)) return null;
    const pp = splitRef(h)[0];
    if (/toc\.ya?ml$/i.test(pp)) return resolve(pp, baseDir);
    if (/\/$/.test(pp)) return resolve(pp + "toc.yml", baseDir);
    return null;
  }
  function buildToc(items, baseDir) {
    const ul = document.createElement("ul");
    for (const it of items || []) {
      if (!it || typeof it !== "object") continue;
      const li = document.createElement("li");
      const link = tocLink(it, baseDir), sub = tocSub(it, baseDir);
      let label;
      if (link) {
        label = document.createElement("a");
        label.href = link.url;
        if (link.ext) { label.target = "_blank"; label.rel = "noopener"; }
        if (link.path && !link.url.includes("#")) label.dataset.path = link.path;   // anchors never count as "current page"
      } else label = document.createElement("span");
      label.textContent = it.name || it.title || "(untitled)";
      if ((it.items && it.items.length) || sub) {
        const d = document.createElement("details"), s = document.createElement("summary");
        s.append(label); d.append(s);
        if (it.items && it.items.length) d.append(buildToc(it.items, baseDir));
        else d.addEventListener("toggle", async function once() {
          if (!d.open) return;
          d.removeEventListener("toggle", once);
          const t = await fetchText(sub);
          if (t == null) return;
          try {
            const data = jsyaml.load(t);
            d.append(buildToc(Array.isArray(data) ? data : data && data.items, dirOf(sub)));
            markCurrent();
          } catch (e) {}
        });
        li.append(d);
      } else li.append(label);
      ul.append(li);
    }
    return ul;
  }
  function markCurrent() {
    tocEl.querySelectorAll("a[data-path]").forEach(a => {
      const cur = a.dataset.path === file;
      a.classList.toggle("current", cur);
      if (cur) for (let d = a.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;
    });
  }
  async function loadToc() {
    if (!info.toc) return;
    const t = await fetchText(info.toc);
    if (t == null) return;
    let data;
    try { data = jsyaml.load(t); } catch (e) { return; }
    tocEl.replaceChildren(buildToc(Array.isArray(data) ? data : data && data.items, dirOf(info.toc)));
    document.body.classList.add("has-toc");
    let pref = null;
    try { pref = localStorage.getItem("mdview-toc"); } catch (e) {}
    if (pref === "hidden" || (pref === null && innerWidth < 900)) document.body.classList.add("toc-hidden");
    markCurrent();
  }
  document.getElementById("tocbtn").addEventListener("click", () => {
    const hidden = document.body.classList.toggle("toc-hidden");
    try { localStorage.setItem("mdview-toc", hidden ? "hidden" : "shown"); } catch (e) {}
  });

  /* ---------- start ---------- */
  (async () => {
    if (!file) { out.textContent = "No file given."; return; }
    try { info = await (await fetch("/__info?f=" + encodeURIComponent(file))).json(); } catch (e) {}
    loadToc();
    await load();
    setInterval(load, 1000);                         // poll for live reload
  })();
</script>
</body>
</html>
